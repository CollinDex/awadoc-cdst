version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: awadoc-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: awadoc
    volumes:
      - awadoc-mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: awadoc-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - awadoc-redis-data:/data

volumes:
  awadoc-mongo-data:
  awadoc-redis-data:
